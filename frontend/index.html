<body><noscript>请在浏览器中启用 JavaScript，以打开三维实验台。</noscript>
<main id="scene" aria-label="三维实验台"></main><div id="vignette"></div>
<section id="launcher" aria-label="实验入口"><div class="launcher-heading"><h1 data-title="磁截止实验室">磁截止实验室</h1><p>真空二极管 · 电子运动与收集</p></div><div class="launcher-actions"><button id="new-experiment" class="launch-primary" data-action="new">开始教学实验 <span>→</span></button><button data-action="open-sandbox">自由探索沙盘</button><button id="continue-experiment" disabled data-action="continue">继续实验</button><small id="save-hint"></small><button data-action="settings">设置</button><button data-action="exit">退出</button></div><footer><span>实验预习 / 装置认识 / 磁场标定</span><small id="preload-status">正在打开实验室</small></footer></section>
<script>
  const entry = document.getElementById('launcher');
  entry.addEventListener('click', event => {
    const button = event.target.closest('button[data-action]');
    if (!button || entry.dataset.ready) return;
    entry.dataset.pending = button.dataset.action;
    document.getElementById('preload-status').textContent = '正在打开…';
  });
</script>
<script type="module" src="chapter1/main.js" onerror="document.getElementById('preload-status').innerHTML='加载失败，&lt;a href=&quot;./&quot;&gt;重新打开&lt;/a&gt;'"></script></body></html>
